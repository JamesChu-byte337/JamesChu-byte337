.zz{opacity:0;animation:zz 3s ease-out infinite}
@keyframes zz{20%{opacity:1}100%{opacity:0;transform:translate(8px,-18px)}}
@media (prefers-reduced-motion:reduce){.star,.steam,.zz{animation:none}}
</style>
